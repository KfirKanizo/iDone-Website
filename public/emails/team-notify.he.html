<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}} · iDone</title>
<!--
  התראה כללית לצוות. נשלח מ-n8n דרך CRM · SUB-04 Notify Team (כל ההתראות חוץ מ-team.newLead).
  משתנים: {{title}} {{urgency}} {{lines}} {{recordUrl}} {{date}} {{time}}
  {{lines}} הוא טקסט רגיל, שורה לכל פרט (white-space:pre-line).
-->
<style>
  @media (max-width: 620px) {
    .container { width: 100% !important; }
    .px { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#F4F6FA;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{title}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F6FA;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#FFFFFF;border:1px solid #DCE1EA;border-radius:6px;">
        <tr>
          <td class="px" dir="rtl" style="padding:20px 32px;background:#0E1A2B;border-radius:6px 6px 0 0;text-align:right;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;">
            <p style="margin:0;font-size:12px;letter-spacing:0.04em;color:#7D97FF;font-weight:600;">{{urgency}}</p>
            <h1 style="margin:6px 0 0;font-size:22px;line-height:1.3;color:#F4F6FA;font-weight:700;">{{title}}</h1>
            <p style="margin:4px 0 0;font-size:14px;color:#A3ADBD;">{{date}} · {{time}}</p>
          </td>
        </tr>
        <tr>
          <td class="px" dir="rtl" style="padding:24px 32px 8px;text-align:right;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:15px;line-height:1.7;color:#0E1A2B;">
            <p dir="auto" style="margin:0;white-space:pre-line;">{{lines}}</p>
          </td>
        </tr>
        <tr>
          <td class="px" dir="rtl" style="padding:16px 32px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right">
              <tr>
                <td style="border:1px solid #0E1A2B;border-radius:6px;"><a href="{{recordUrl}}" target="_blank" style="display:inline-block;padding:9px 18px;font-family:'IBM Plex Sans Hebrew',Arial,sans-serif;font-size:14px;font-weight:600;color:#0E1A2B;text-decoration:none;">פתיחה ב-Airtable</a></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <p style="margin:12px 0 0;font-family:Arial,sans-serif;font-size:11px;color:#A3ADBD;">התראה פנימית אוטומטית מ-n8n · iDone CRM</p>
    </td>
  </tr>
</table>
</body>
</html>
